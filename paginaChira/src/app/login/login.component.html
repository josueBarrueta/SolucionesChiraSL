<section class="login" aria-label="Inicio de sesión">
  <form class="login-form" (ngSubmit)="acceder()">
    <label for="username">Usuario</label>
    <input id="username" name="username" type="text" autocomplete="username"
      [(ngModel)]="username" required (input)="error = ''" />

    <label for="password">Contraseña</label>
    <div class="password-field">
      <input id="password" name="password" [type]="showPassword ? 'text' : 'password'"
        autocomplete="current-password" [(ngModel)]="password" required (input)="error = ''" />
      <button class="password-toggle" type="button" (click)="showPassword = !showPassword"
        [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        [attr.aria-pressed]="showPassword" aria-controls="password">
        <i class="pi" [class.pi-eye]="showPassword" [class.pi-eye-slash]="!showPassword"
          aria-hidden="true"></i>
      </button>
    </div>

    @if (error) {
      <p class="login-error" role="alert">{{ error }}</p>
    }

    <button type="submit" [disabled]="loading">{{ loading ? 'Accediendo…' : 'Acceder' }}</button>
  </form>
</section>
