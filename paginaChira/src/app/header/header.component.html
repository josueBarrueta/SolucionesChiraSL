<header class="header" (keydown.escape)="cerrarConEscape($event)">
  <div class="header-container">
    <a
      class="brand"
      routerLink="/"
      aria-label="Soluciones Chira SL, inicio"
      (click)="cerrarMenu()"
    >
      <svg
        class="brand-icon"
        viewBox="0 0 48 48"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M6 23 24 7l18 16" />
        <path d="M11 20v21h26V20" />
        <path d="M20 41V28h8v13" />
      </svg>

      <span class="brand-text">
        <span class="brand-label">SOLUCIONES</span>
        <span class="brand-name">CHIRA <span>SL</span></span>
      </span>
    </a>

    <button
      #menuButton
      class="menu-toggle"
      type="button"
      aria-controls="navegacion-principal"
      [attr.aria-expanded]="menuAbierto()"
      [attr.aria-label]="
        menuAbierto() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'
      "
      [class.is-open]="menuAbierto()"
      (click)="alternarMenu()"
    >
      <span class="menu-icon" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
      <span>{{ menuAbierto() ? 'Cerrar' : 'Menú' }}</span>
    </button>

    <nav
      id="navegacion-principal"
      aria-label="Navegación principal"
      [class.is-open]="menuAbierto()"
    >
      <ul>
        <li>
          <a
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            (click)="cerrarMenu()"
          >
            Inicio
          </a>
        </li>

        <li class="services-nav" (focusout)="cerrarAlSalir($event)">
          <div class="services-control">
            <a
              routerLink="/servicios"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              ariaCurrentWhenActive="page"
              (click)="cerrarMenu()"
            >
              Servicios
            </a>

            <button
              #servicesButton
              class="services-toggle"
              type="button"
              aria-controls="services-submenu"
              [attr.aria-expanded]="serviciosAbiertos()"
              [attr.aria-label]="
                serviciosAbiertos() ? 'Cerrar lista de servicios' : 'Abrir lista de servicios'
              "
              (click)="alternarServicios()"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
                [class.expanded]="serviciosAbiertos()"
              >
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
          </div>

          <ul
            id="services-submenu"
            class="services-submenu"
            [hidden]="!serviciosAbiertos()"
          >
            @for (service of services; track service.slug) {
              <li>
                <a
                  [routerLink]="['/servicios', service.slug]"
                  routerLinkActive="active"
                  ariaCurrentWhenActive="page"
                  (click)="cerrarMenu()"
                >
                  {{ service.name }}
                </a>
              </li>
            }
          </ul>
        </li>

        <li>
          <a
            routerLink="/nosotros"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (click)="cerrarMenu()"
          >
            Nosotros
          </a>
        </li>

        <li>
          <a
            routerLink="/contacto"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (click)="cerrarMenu()"
          >
            Contacto
          </a>
        </li>
      </ul>
    </nav>

    <div class="header-actions" role="group" aria-label="Contactar con Soluciones Chira">
      <a
        class="contact-button"
        href="tel:+34610928521"
        aria-label="Llamar al 610 92 85 21"
        (click)="cerrarMenu()"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M22 16.92v3a2 2 0 0 1-2.18 2
            19.79 19.79 0 0 1-8.63-3.07
            19.5 19.5 0 0 1-6-6
            19.79 19.79 0 0 1-3.07-8.67
            A2 2 0 0 1 4.11 2h3
            a2 2 0 0 1 2 1.72
            c.13.96.36 1.9.69 2.79
            a2 2 0 0 1-.45 2.11L8.09 9.89
            a16 16 0 0 0 6 6l1.27-1.27
            a2 2 0 0 1 2.11-.45
            c.89.33 1.83.56 2.79.69
            A2 2 0 0 1 22 16.92z"
          />
        </svg>

        <span class="contact-label">Llámanos</span>
      </a>

      <a
        class="contact-button whatsapp-button"
        appWhatsapp
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Escríbenos por WhatsApp al 610 92 85 21"
        (click)="cerrarMenu()"
      >
        <i class="pi pi-whatsapp" aria-hidden="true"></i>
        <span class="contact-label">Escríbenos</span>
      </a>
    </div>
  </div>
</header>
