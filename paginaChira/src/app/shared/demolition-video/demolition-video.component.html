<div class="comparison" role="group" aria-label="Antes y después de un derribo interior">
  @for (zone of zones; track zone.name; let i = $index) {
    @if (selected() === i) {
      <div class="pair">
        <figure>
          <figcaption>Antes</figcaption>
          <div class="soft-edge"><video [src]="media + zone.before + '.mp4'" muted playsinline preload="metadata" (loadedmetadata)="sync()" (ended)="advance()" (error)="failed.set(true)" [attr.aria-label]="zone.name + ' antes del derribo'"></video></div>
        </figure>
        <figure>
          <figcaption>Después</figcaption>
          <div class="soft-edge"><video [src]="media + zone.after + '.mp4'" muted playsinline preload="metadata" (loadedmetadata)="sync()" (ended)="advance()" (error)="failed.set(true)" [attr.aria-label]="zone.name + ' después del derribo'"></video></div>
        </figure>
      </div>
    }
  }
  <div class="footnote">
    <span>{{ zones[selected()].name }} · Antes y después del derribo interior</span>
    <button class="playback" type="button" (click)="toggle()" [attr.aria-label]="paused() ? 'Reproducir vídeos' : 'Pausar vídeos'"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true" focusable="false">
        @if (paused()) { <path d="M8 5v14l11-7z" /> }
        @else { <path d="M6 5h4v14H6zM14 5h4v14h-4z" /> }
      </svg></button>
  </div>
  @if (failed()) { <p role="status">No se ha podido cargar el vídeo. Prueba de nuevo más tarde.</p> }
</div>
