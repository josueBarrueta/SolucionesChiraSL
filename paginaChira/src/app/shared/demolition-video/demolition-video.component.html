<div class="comparison" role="group" aria-label="Antes y después de un derribo interior">
  <div class="pairs">
    @for (zone of zones; track zone.name; let i = $index) {
      <div
        class="pair"
        [class.current]="selected() === i"
        [class.leaving]="leaving() === i"
        [attr.aria-hidden]="selected() !== i"
      >
        <figure>
          <figcaption>Antes</figcaption>
          <div class="soft-edge">
            <video
              [src]="media + zone.before + '.mp4'"
              muted
              playsinline
              preload="auto"
              (loadeddata)="ready()"
              (ended)="advance(i)"
              (error)="failed.set(true)"
              [attr.aria-label]="zone.name + ' antes del derribo'"
            ></video>
          </div>
        </figure>
        <figure>
          <figcaption>Después</figcaption>
          <div class="soft-edge">
            <video
              [src]="media + zone.after + '.mp4'"
              muted
              playsinline
              preload="auto"
              (loadeddata)="ready()"
              (ended)="advance(i)"
              (error)="failed.set(true)"
              [attr.aria-label]="zone.name + ' después del derribo'"
            ></video>
          </div>
        </figure>
      </div>
    }
  </div>
  <div class="footnote">
    <span>{{ zones[selected()].name }} · Antes y después</span>
    <button
      class="playback"
      type="button"
      (click)="toggle()"
      [attr.aria-label]="paused() ? 'Reproducir vídeos' : 'Pausar vídeos'"
    >
      <svg
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="currentColor"
        aria-hidden="true"
        focusable="false"
      >
        @if (paused()) {
          <path d="M8 5v14l11-7z" />
        } @else {
          <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
        }
      </svg>
    </button>
  </div>
  @if (failed()) {
    <p role="status">No se ha podido cargar el vídeo. Prueba de nuevo más tarde.</p>
  }
</div>
